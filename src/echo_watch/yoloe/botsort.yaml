# Values are the installed defaults with ReID explicitly OFF and sparse optical-flow motion compensation. They are
# STARTING settings for the owner's evaluation, not measured optimal settings. The product reads THIS file, never the
# library's current default tracker. track_buffer counts tracker UPDATES (one per processed source frame), not seconds.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 30
match_thresh: 0.8
fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
